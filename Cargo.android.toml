[package]
name = "muguet-android"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "muguet-android"
path = "src/android_entry.rs"

[dependencies]
wasmtime = { version = "*", default-features = false, features = ["runtime", "threads", "profiling", "anyhow"] }
anyhow = "1"
serde_json = "1"
wgpu = "*"
pollster = "1"
regex = "1"
android-activity = "0.6"
raw-window-handle = "0.6"
ndk = "0.9"
ndk-glue = "0.7"
ndk-sys = "0.6"
log = "0.4"
android_logger = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
wasmparser = { version = "*", optional = true }
wasm-encoder = { version = "*", optional = true, features = ["wasmparser"] }
jni = "0.21"
cpal = "0.15"

[features]
default = ["jit"]
jit = ["wasmtime/cranelift", "wasmtime/parallel-compilation", "dep:wasmparser", "dep:wasm-encoder"]

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
wgpu-core = { path = "vendor/wgpu-core" }