name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["Build Android APK"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Muguet.apk
          path: ./apk

      - name: Prepare site
        run: |
          mkdir -p site
          APK_PATH=$(find ./apk -name "*.apk" | head -1)
          cp "$APK_PATH" site/Muguet.apk
          
          # Get version from filename or use date
          VERSION=$(date -u +"%Y%m%d-%H%M")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Generate install page
        run: |
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Muguet — GTA V on Android</title>
            <style>
              * { box-sizing: border-box; }
              body {
                margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background: #0d0d0d; color: #e0e0e0; min-height: 100vh;
                display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem;
              }
              .container { max-width: 520px; width: 100%; text-align: center; }
              h1 { font-size: 2.5rem; font-weight: 700; margin: 0 0 0.5rem; background: linear-gradient(135deg, #bb86fc, #03dac5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
              .subtitle { color: #888; margin-bottom: 2rem; font-size: 1.1rem; }
              .btn {
                display: inline-block; padding: 1rem 2rem; font-size: 1.1rem; font-weight: 600;
                background: linear-gradient(135deg, #bb86fc, #3700b3); color: #fff;
                border-radius: 12px; text-decoration: none; margin: 1rem 0;
                box-shadow: 0 4px 24px rgba(187, 134, 252, 0.3);
                transition: transform 0.15s, box-shadow 0.15s;
              }
              .btn:active { transform: scale(0.98); box-shadow: 0 2px 12px rgba(187, 134, 252, 0.4); }
              .meta { color: #666; font-size: 0.85rem; margin: 1.5rem 0; }
              .badges { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; margin: 1rem 0; }
              .badge { font-size: 0.7rem; padding: 0.25rem 0.5rem; border-radius: 4px; background: #1e1e1e; color: #aaa; }
              .features { text-align: left; margin: 2rem 0; padding: 0 1rem; }
              .features h3 { color: #bb86fc; font-size: 1rem; margin: 1rem 0 0.5rem; }
              .features ul { margin: 0; padding-left: 1.2rem; color: #ccc; line-height: 1.8; }
              .footer { color: #444; font-size: 0.75rem; margin-top: 3rem; }
              a { color: #03dac5; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>MUGUET</h1>
              <p class="subtitle">GTA V on Android • Native WebAssembly Port</p>
              
              <div class="badges">
                <span class="badge">arm64 • API 24+</span>
                <span class="badge">Vulkan + Oboe</span>
                <span class="badge">Multiplayer</span>
                <span class="badge">Open Source</span>
              </div>
              
              <a class="btn" href="Muguet.apk" download="Muguet.apk">
                ⬇ Download Muguet.apk
              </a>
              
              <p class="meta">Version: <strong id="ver">${VERSION}</strong> · Size: <strong id="sz">~</strong> · Built: <strong id="dt">${BUILD_DATE}</strong></p>
              
              <div class="features">
                <h3>Features</h3>
                <ul>
                  <li>Launcher UI — import, settings, multiplayer config</li>
                  <li>Touch overlay — virtual joystick, 19 buttons, nav D-pad, wheel menus</li>
                  <li>Oboe audio — low-latency, pauses on home, resumes on reopen</li>
                  <li>Lifecycle — GPU suspend/resume, clean destroy</li>
                  <li>Multiplayer — host/join via LAN or internet (UDP 47520)</li>
                </ul>
                <h3>Requirements</h3>
                <ul>
                  <li>Android 7.0+ (API 24), arm64 device</li>
                  <li>6 GB RAM recommended (game uses ~3 GB)</li>
                  <li>Vulkan 1.1+ (all arm64 devices since ~2016)</li>
                </ul>
                <h3>Install</h3>
                <ul>
                  <li>Download APK above → open on device → install</li>
                  <li>Or: <code>adb install Muguet.apk</code></li>
                  <li>Launch Muguet → Import <code>game.zip</code> → Play</li>
                </ul>
              </div>
              
              <p class="footer">
                <a href="https://github.com/c22dev/muguet">Source</a> · 
                <a href="https://github.com/c22dev/muguet/releases">Releases</a> · 
                <a href="https://github.com/c22dev/muguet/actions">Build Logs</a> · 
                GPL-3.0
              </p>
            </div>
            
            <script>
              // Fill in meta
              const apkUrl = 'Muguet.apk';
              fetch(apkUrl, { method: 'HEAD' }).then(r => {
                if (r.ok) {
                  const sz = r.headers.get('content-length');
                  document.getElementById('sz').textContent = sz ? (sz/1024/1024).toFixed(1) + ' MB' : '~';
                }
              });
              document.getElementById('dt').textContent = new Date().toLocaleString();
            </script>
          </body>
          </html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4